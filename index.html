<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA PATADA KING KONG IA - 3D</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;overflow:hidden}
#canvas{width:100%;height:100vh;display:block}
#ui{position:absolute;top:10px;left:10px;z-index:10;background:rgba(0,0,0,0.7);padding:15px;border-radius:10px}
button{padding:12px 20px;margin:5px;font-size:16px;background:#ffcc00;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
button:hover{background:#fff}
#whatsapp{background:#25D366;color:white}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
<h2>🦍 LA PATADA KING KONG IA</h2>
<button onclick="kick()">¡PATADA KING KONG!</button>
<button id="whatsapp" onclick="shareWhatsApp()">📲 Compartir WhatsApp</button>
<p id="status">Listo para patear</p>
</div>

<script type="importmap">
{
"imports":{
"three":"https://unpkg.com/three@0.160.0/build/three.module.js"
}
}
</script>

<script type="module">
import * as THREE from 'three';
let scene,camera,renderer,kong,leg,angle=0,kicking=false;
scene=new THREE.Scene();
scene.background=new THREE.Color(0x111122);
camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.set(0,2,6);
renderer=new THREE.WebGLRenderer({canvas:document.getElementById('canvas'),antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);

// Luz
const light=new THREE.DirectionalLight(0xffffff,1.5);light.position.set(5,10,5);scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff,0.5));

// Suelo
const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0x333333}));
floor.rotation.x=-Math.PI/2;scene.add(floor);

// King Kong simple 3D
kong=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.5,0.8),new THREE.MeshStandardMaterial({color:0x222222}));
body.position.y=1.5;kong.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(0.5,16,16),new THREE.MeshStandardMaterial({color:0x111111}));
head.position.y=2.7;kong.add(head);
leg=new THREE.Mesh(new THREE.BoxGeometry(0.4,1.2,0.4),new THREE.MeshStandardMaterial({color:0x111111}));
leg.position.set(0.3,0.6,0.5);leg.geometry.translate(0,0.6,0);kong.add(leg);
scene.add(kong);

function animate(){
requestAnimationFrame(animate);
if(kicking){
angle+=0.15;
leg.rotation.x=Math.sin(angle)*1.8;
if(angle>3.14){kicking=false;angle=0;leg.rotation.x=0;document.getElementById('status').innerText='¡BOOM! Patada completada 💥';}
}
renderer.render(scene,camera);
}
animate();

window.kick=function(){
if(!kicking){kicking=true;angle=0;document.getElementById('status').innerText='¡KING KONG PATEANDO! 🦶';}
}

window.shareWhatsApp=function(){
// CAMBIA TU NUMERO ABAJO
let phone="5355555555"; // pon tu numero sin +
let text=encodeURIComponent("Mira mi juego 3D LA PATADA KING KONG IA 🦍: https://gonzalespachecolaura23-glitch.github.io/la-patada-king-kong-IA/");
let url=`https://wa.me/${phone}?text=${text}`;
// Para compartir sin numero fijo usa: https://wa.me/?text=
window.open(url,'_blank');
}

window.addEventListener('resize',()=>{
camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
