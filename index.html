<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LA PATADA KING KONG IA</title>
<style>
body{margin:0;background:#000;color:#0f0;font-family:monospace;padding:10px}
.panel{max-width:400px;margin:20px auto;background:#0a0a0a;border:2px solid #0f0;border-radius:15px;padding:20px;box-shadow:0 0 25px #0f0}
h1{text-align:center;font-size:22px}
input{width:100%;padding:12px;margin:8px 0;background:#111;color:#0f0;border:1px solid #0f0;border-radius:10px;box-sizing:border-box}
button{width:100%;padding:13px;margin-top:10px;background:#0f0;color:#000;font-weight:bold;border:none;border-radius:10px;font-size:15px}
#codigo{font-size:18px;text-align:center;margin-top:15px;background:#111;padding:15px;border-radius:10px;min-height:20px;word-break:break-all}
.small{font-size:11px;color:#555;text-align:center;margin-top:10px}
hr{border:0;border-top:1px solid #0f0;margin:20px 0}
</style>
</head>
<body>
<div class="panel">
<h1>🦍 LA PATADA KING KONG IA</h1>
<p style="text-align:center">@pocholo_dark_king_kong_bot</p>
<hr>
<p>1. WHATSAPP - VINCULACIÓN POR NÚMERO:</p>
<input id="num" placeholder="Ej: 5351234567 (sin +)">
<button onclick="pedirCodigo()">🦍 GENERAR CÓDIGO DE 8 DÍGITOS</button>
<div id="codigo">Aquí saldrá tu código</div>
<hr>
<p>2. TELEGRAM - TOKEN:</p>
<input id="tg" type="password" placeholder="8899349942:AAES4zwAfDXI6L8zFbbKZv4cYTt85mWH5qo">
<button onclick="saveTG()" style="background:#0088cc;color:#fff">GUARDAR EN TELÉFONO</button>
<div id="status" style="text-align:center;margin-top:10px"></div>
<p class="small">Repo: la-patada-king-kong-IA | Todo se guarda solo en tu teléfono</p>
</div>
<script>
const BACKEND_URL = "https://PON-AQUI-TU-LINK-DE-RENDER.onrender.com";
async function pedirCodigo(){
  const n = document.getElementById('num').value.trim();
  if(n.length < 8){document.getElementById('codigo').innerHTML='❌ Pon un número válido';return;}
  document.getElementById('codigo').innerHTML='⏳ Generando código...';
  try{
    const res = await fetch(BACKEND_URL + '/code', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({number:n})});
    const data = await res.json();
    if(data.code){
      document.getElementById('codigo').innerHTML='✅ TU CÓDIGO:<br><b style="font-size:32px;letter-spacing:4px">'+data.code+'</b><br><br>WhatsApp > Dispositivos vinculados > Vincular con número';
    } else {
      document.getElementById('codigo').innerHTML='❌ Error: '+(data.error||'Revisa backend');
    }
  }catch(e){
    document.getElementById('codigo').innerHTML='❌ Sin backend aún<br>Cuando pongas tu link de Render funcionará';
  }
}
function saveTG(){
  const v=document.getElementById('tg').value;
  if(!v){document.getElementById('status').innerHTML='❌ Pega token';return;}
  localStorage.setItem('tg_king',v);
  document.getElementById('status').innerHTML='✅ Guardado en este teléfono';
}
window.onload=()=>{
  const s=localStorage.getItem('tg_king');
  if(s)document.getElementById('tg').value=s;
}
</script>
</body>
</html>
